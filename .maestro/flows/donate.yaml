appId: de.democracy-deutschland.clientapp.internal
# In-App-Spenden (specs/001-in-app-donations, quickstart V8/V9): Spenden-Screen öffnen,
# Monatlich nur mit E-Mail, Mindestbetrag-Hinweis, Betrag wählen, Stripe-Zahlungsfenster öffnen.
# Voraussetzung: internal-Build gegen eine API mit DONATIONS_ENABLED=true (Stripe-Testmodus).
---
- launchApp
- waitForAnimationToEnd
- swipe:
    start: 0, 300
    end: 300, 300
- waitForAnimationToEnd
- tapOn:
    id: "sidebar-donate"
- waitForAnimationToEnd
- assertVisible: "Direkt in der App spenden"
- assertVisible:
    id: "donate-iban"
# Monatlich: ohne E-Mail ist der Button deaktiviert (FR-007, T046)
- tapOn:
    id: "donate-interval-monthly"
- assertVisible:
    id: "donate-submit"
    enabled: false
- tapOn:
    id: "donate-email"
- inputText: "pate@example.org"
- hideKeyboard
- assertVisible:
    id: "donate-submit"
    enabled: true
- assertVisible: ".*monatlich spenden"
- tapOn:
    id: "donate-interval-one_time"
- tapOn:
    id: "donate-amount-custom"
- inputText: "3"
- assertVisible:
    id: "donate-hint-min"
- eraseText: 3
- inputText: "10"
- hideKeyboard
# Intl setzt ein geschütztes Leerzeichen vor „€" – daher Regex mit „.“
- assertVisible: "10,00.€ spenden"
- tapOn:
    id: "donate-submit"
- waitForAnimationToEnd
- assertVisible: "(Karte|Card)"
- takeScreenshot: artifacts/maestro/donate/payment_sheet
